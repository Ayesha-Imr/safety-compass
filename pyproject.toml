[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safety-compass"
version = "0.1.3"
description = "Monitor safety-relevant concept directions during LLM fine-tuning"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Ayesha Imran", email = "ayesha.i1505@gmail.com"},
    {name = "Muhammad Aaliyan", email = "aaliyan1230@gmail.com"},
]
keywords = [
    "safety",
    "alignment",
    "fine-tuning",
    "concept-directions",
    "llm",
    "monitoring",
    "interpretability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
gpu = [
    "bitsandbytes>=0.43",
    "accelerate>=0.29",
    "peft>=0.10",
]
data = [
    "datasets>=2.19",
    "huggingface-hub>=0.23",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.3",
]

[project.urls]
Homepage = "https://github.com/Ayesha-Imr/safety-compass"
Repository = "https://github.com/Ayesha-Imr/safety-compass"
Issues = "https://github.com/Ayesha-Imr/safety-compass/issues"

[project.scripts]
safety-compass-extract = "safety_compass.cli:extract_directions"
safety-compass-finetune = "safety_compass.cli:run_monitored_finetune"
safety-compass-pairs = "safety_compass.cli:prepare_contrastive_pairs"

[tool.hatch.build.targets.wheel]
packages = ["src/safety_compass"]

[tool.hatch.build.targets.sdist]
include = ["src/", "scripts/", "LICENSE", "README.md"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/extract_directions.py" = "safety_compass/_scripts/extract_directions.py"
"scripts/run_monitored_finetune.py" = "safety_compass/_scripts/run_monitored_finetune.py"
"scripts/prepare_contrastive_pairs.py" = "safety_compass/_scripts/prepare_contrastive_pairs.py"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
