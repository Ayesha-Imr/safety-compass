[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safety-compass"
version = "0.1.0"
description = "Monitor safety-relevant concept directions during LLM fine-tuning"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
gpu = [
    "bitsandbytes>=0.43",
    "accelerate>=0.29",
    "peft>=0.10",
]
data = [
    "datasets>=2.19",
    "huggingface-hub>=0.23",
]
viz = [
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/safety_compass"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
pythonpath = ["src"]
