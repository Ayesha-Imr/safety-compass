name: Bug Report
description: Report a bug in Safety Compass
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, torch version, transformers version
      placeholder: |
        Python: 3.11
        OS: Ubuntu 22.04
        torch: 2.3.0
        transformers: 4.44.0
        safety-compass: 0.1.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Output
      description: Paste any relevant error messages or stack traces
      render: shell
