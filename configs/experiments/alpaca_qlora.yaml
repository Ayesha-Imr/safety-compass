seed: 42

model_config_file: configs/models/qwen3-8b.yaml

concepts:
  - name: refusal
    config_file: configs/concepts/refusal.yaml
    best_layer: 31
    baseline_auroc: 0.94
  - name: sycophancy
    config_file: configs/concepts/sycophancy.yaml
    best_layer: 18
    baseline_auroc: 0.87
  - name: deception
    config_file: configs/concepts/deception.yaml
    best_layer: 20
    baseline_auroc: 0.99

monitor:
  measure_every_n_steps: 50
  include_cross_concept_cosines: true
  output_csv: drift_log.csv

dataset:
  name: tatsu-lab/alpaca
  subset_size: 5000
  max_seq_length: 512

qlora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

training:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  num_train_epochs: 3
  learning_rate: 0.0002
  warmup_ratio: 0.03
  fp16: true
  gradient_checkpointing: true
  logging_steps: 10
  save_strategy: "no"
  report_to: "none"

smoke:
  subset_size: 32
  max_steps: 2
  measure_every_n_steps: 1
